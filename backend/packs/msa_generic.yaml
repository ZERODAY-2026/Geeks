# Checklist pack: freelance and services agreements (standard, generic: not tuned for India).
pack_id: msa_generic
doc_type: msa
jurisdiction: UNKNOWN
version: "1"
depth: standard
topics:
  - id: msa.scope_deliverables
    title: Scope and deliverables
    query: scope services deliverables statement of work
    lexicon: [scope, deliverables, statement of work, services]
    hypothesis: The agreement describes the work and what is delivered.
    severity: HIGH
  - id: msa.revisions
    title: Revisions
    query: revisions changes rounds of revision
    lexicon: [revision, revisions, changes, rounds]
    hypothesis: The agreement says how many revisions are included.
    severity: MEDIUM
    silence_note: Not found. Ask how many revisions are included.
  - id: msa.payment_terms
    title: Payment terms and late payment
    query: payment terms invoice days late payment
    lexicon: [payment, invoice, late, days after]
    hypothesis: The agreement says when and how the client pays, and what happens if payment is late.
    severity: HIGH
  - id: msa.ip_transfer
    title: Ownership of work
    query: intellectual property ownership transfer on payment
    lexicon: [intellectual property, ownership, copyright, transfer]
    hypothesis: The agreement says who owns the work and when ownership passes.
    severity: HIGH
  - id: msa.confidentiality
    title: Confidentiality
    query: confidential information non-disclosure
    lexicon: [confidential, non-disclosure]
    hypothesis: The agreement says what information must be kept secret.
    severity: MEDIUM
    silence_note: Not found.
  - id: msa.indemnity
    title: Indemnity
    query: indemnify indemnity third-party claims
    lexicon: [indemnif, indemnity, third-party]
    hypothesis: The agreement says who must cover losses from claims.
    severity: HIGH
  - id: msa.liability_cap
    title: Liability cap
    query: limitation of liability cap maximum liability
    lexicon: [liability, cap, limitation of liability, uncapped]
    hypothesis: The agreement says whether liability is limited and to what amount.
    severity: HIGH
    silence_note: Not found. Unlimited liability can be a large risk.
  - id: msa.termination_kill_fee
    title: Termination and kill fee
    query: termination kill fee cancellation notice
    lexicon: [terminat, kill fee, cancel, cancellation]
    hypothesis: The agreement says how either side can end it and whether a cancellation fee applies.
    severity: HIGH
  - id: msa.non_solicit
    title: Non-solicit
    query: non-solicit solicit employees customers
    lexicon: [solicit, poach]
    hypothesis: The agreement says whether either side may hire or approach the other's people or clients.
    severity: MEDIUM
    silence_note: Not found.
  - id: msa.acceptance
    title: Acceptance criteria
    query: acceptance criteria approval deemed accepted
    lexicon: [acceptance, accept, approval, deemed]
    hypothesis: The agreement says how delivered work is accepted.
    severity: MEDIUM
    silence_note: Not found. Ask how acceptance is decided.
  - id: msa.assignment
    title: Assignment
    query: assignment transfer of this agreement to another party
    lexicon: [assign, assignment, transfer]
    hypothesis: The agreement says whether either side can hand the contract to someone else.
    severity: MEDIUM
  - id: msa.governing_law
    title: Governing law and disputes
    query: governing law jurisdiction courts arbitration
    lexicon: [governed by, governing law, jurisdiction, courts, arbitration]
    hypothesis: The agreement says which law applies and how disputes are resolved.
    severity: MEDIUM
    jurisdiction_sensitive: true
